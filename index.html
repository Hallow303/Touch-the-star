<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="image/icon.png" type="image/x-png">
    <title>Click!</title>
</head>
<body>
    <header id="topo">
        <div class="nivel-info">
            <span id="nivel">LEVEL 1</span>
            <span id="experiencia">0 / 100 XP</span>
        </div>

        <div class="barra-xp">
            <div id="progresso-xp"></div>
        </div>
    </header>

    <main id="inicio">
        <div class="inicio-conteudo">
            <h1>Click!</h1>
            <p>Click to collect stars.</p>
            <p>Buy planets to increase your production.</p>
            <p>Reach 10,000,000 points to win.</p>
            <div id="jogar">PLAY</div>
        </div>
    </main>

    <main id="jogo">
        <div id="centro">
            <div id="pontos">Points: 0</div>
            <div id="click">CLICK</div>
        </div>
    </main>

    <div id="planetasTela"></div>

    <section id="loja">
        <h2>STAR SHOP</h2>
        <div class="cards-loja" id="estoquePlanetas"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
